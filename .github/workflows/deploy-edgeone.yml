name: Deploy to EdgeOne Pages

# 推送到 main 即自动构建并部署到 EdgeOne Makers（项目 nxz-words）
# 前置：仓库 Settings → Secrets and variables → Actions 添加 EDGEONE_API_TOKEN
# 说明：环境变量（STORAGE_DRIVER / SESSION_SECRET / AI_* 等）已配置在 EdgeOne 项目上，
#       由平台在运行时注入，无需在此 workflow 中重复声明。

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持在 Actions 页面手动触发

concurrency:
  group: edgeone-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble deploy directory
        run: |
          mkdir -p .deploy
          cp -r .next .deploy/.next
          cp package.json edgeone.json .deploy/

      - name: Deploy to EdgeOne
        run: npx -y edgeone@latest makers deploy ./.deploy -n nxz-words -t "${{ secrets.EDGEONE_API_TOKEN }}" -e production -a overseas
